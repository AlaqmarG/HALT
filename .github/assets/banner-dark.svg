<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="HALT - autonomous AI agents that A/B test your storefront">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14103A"/>
      <stop offset="0.38" stop-color="#4F46E5"/>
      <stop offset="0.72" stop-color="#9333EA"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.13"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <ellipse cx="600" cy="150" rx="520" ry="190" fill="url(#glow)"/>

    <!-- AI customer agents -->
    <g stroke="#ffffff" stroke-opacity="0.42" fill="#ffffff" fill-opacity="0.16">
      <circle cx="104" cy="96" r="15"/>
      <circle cx="72" cy="158" r="15"/>
      <circle cx="118" cy="216" r="15"/>
      <circle cx="176" cy="132" r="15"/>
      <circle cx="168" cy="228" r="15"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.20" stroke-width="1.5" fill="none">
      <path d="M104 96 L176 132 M72 158 L176 132 M118 216 L168 228 M176 132 L168 228"/>
    </g>

    <!-- storefront grid -->
    <g fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.30">
      <rect x="1004" y="92" width="40" height="40" rx="7"/>
      <rect x="1056" y="92" width="40" height="40" rx="7"/>
      <rect x="1108" y="92" width="40" height="40" rx="7"/>
      <rect x="1004" y="144" width="40" height="40" rx="7"/>
      <rect x="1056" y="144" width="40" height="40" rx="7"/>
      <rect x="1108" y="144" width="40" height="40" rx="7"/>
      <rect x="1004" y="196" width="40" height="40" rx="7"/>
      <rect x="1056" y="196" width="40" height="40" rx="7"/>
      <rect x="1108" y="196" width="40" height="40" rx="7"/>
    </g>
    <rect x="1056" y="144" width="40" height="40" rx="7" fill="#2DD4BF" fill-opacity="0.55"/>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
      <text x="600" y="86" font-size="15" font-weight="600" letter-spacing="4.5" fill="#ffffff" fill-opacity="0.72">UOFTHACKS 13 &#183; AI STOREFRONT OPTIMIZATION</text>
      <text x="600" y="180" font-size="90" font-weight="800" letter-spacing="9" fill="#ffffff">HALT</text>
      <text x="600" y="232" font-size="21" font-weight="500" fill="#ffffff" fill-opacity="0.88">Autonomous AI agents that A/B test your storefront &#8212; in minutes, not weeks.</text>
    </g>
  </g>
</svg>
